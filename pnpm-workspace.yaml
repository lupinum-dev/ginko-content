packages:
  - ./
  - packages/*
  - docs
  - playground/*
  - examples/*/*
  - test/fixtures/*
minimumReleaseAge: 1440
# Remove this exception after 2026-08-14. This exact version is the reviewed
# Ginko Docs release candidate used by the Lupinum documentation fleet.
minimumReleaseAgeExclude:
  - '@lupinum/ginko-docs@0.3.0-rc.3'
linkWorkspacePackages: deep
onlyBuiltDependencies:
  - esbuild
  - vue-demi
overrides:
  "@babel/core": 7.29.6
  esbuild: 0.28.1
  "@tiptap/core": 3.27.3
  "@tiptap/pm": 3.27.3
  "@tiptap/starter-kit": 3.27.3
  "@vue/compiler-sfc": 3.5.39
  launch-editor: 2.14.1
  tar: 7.5.16
  typescript: 5.9.3
  vue: 3.5.39
  shell-quote: 1.8.4
  ws: 8.21.0
  js-yaml: 4.2.0
  linkify-it: 5.0.2
packageExtensions:
  vue-docgen-web-types@0.1.8:
    dependencies:
      minimist: ^1.2.8
