packages:
  - ./
  - packages/*
  - docs
  - playground/*
  - examples/*/*
  - test/fixtures/*
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

linkWorkspacePackages: deep
overrides:
  "@babel/core": 7.29.13
  esbuild: 0.28.2
  "@tiptap/core": 3.33.0
  "@tiptap/pm": 3.33.0
  "@tiptap/starter-kit": 3.33.0
  "@vue/compiler-sfc": 3.5.45
  launch-editor: 2.14.2
  tar: 7.5.22
  typescript: 5.9.3
  vue: 3.5.45
  shell-quote: 1.12.0
  ws: 8.22.1
  js-yaml: 4.3.2
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@3: 5.0.12
  brace-expansion@4: 5.0.12
  brace-expansion@5: 5.0.12
  nanoid@3: 3.3.20
  '@hono/node-server@1': 1.19.18
  hono: 4.13.17
  svgo: 4.1.0
  fast-uri: 3.1.9
  undici: 8.12.4
  sharp: 0.35.5
  fast-xml-parser: 5.12.0
  postcss: 8.5.32
  browserslist: 4.29.5
  devalue@5: 5.9.4
  postcss-selector-parser: 7.1.7
  ip-address: 10.7.6
  linkify-it: 5.0.2
  nuxtseo-shared: 5.3.16
  '@simple-git/argv-parser@<2.0.1': 2.0.1
  katex@<0.18.2: 0.19.1
  seroval@<1.6.3: 1.7.10
  source-map-js@<1.2.2: 1.2.2
  proxy-addr@<2.0.8: 2.0.8
  zod@<4.6.6: 4.6.7
  '@modelcontextprotocol/sdk@<1.32.0': 1.32.2
packageExtensions:
  vue-docgen-web-types@0.1.8:
    dependencies:
      minimist: ^1.2.8
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: false
  vue-demi: true

# Dev/build only; expiry is enforced by check:dependencies.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # {"owner": "mat4m0", "reason": "Advertised patched version is unpublished.", "expires": "2026-11-06T00:00:00Z"}
