name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from packages/content/package.json
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-ginko-content
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          node -e "if (!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid release version')"
          tag_ref="refs/tags/v$RELEASE_VERSION"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq ".[] | select(.ref == \"$tag_ref\") | .object | \"\\(.type) \\(.sha)\"")"
          if test -n "$tag_object"; then
            tag_type="${tag_object%% *}"
            tag_sha="${tag_object#* }"
            while test "$tag_type" = "tag"; do
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object | "\\(.type) \\(.sha)"')"
              tag_type="${tag_object%% *}"
              tag_sha="${tag_object#* }"
            done
            test "$tag_type" = "commit"
            test "$tag_sha" = "$GITHUB_SHA"
          fi

      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | first | .id // empty')"
          test -n "$run_id"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ginko-content-release
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify exact artifact
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const path=require('node:path');
          const files=fs.readdirSync('.release');const tarballs=files.filter(file=>file.endsWith('.tgz'));
          if(tarballs.length!==1||!files.includes('release-artifact.json')||!files.includes('release-certification.json'))throw new Error('Expected one tarball and both release manifests');
          const m=require('./.release/release-artifact.json');const c=require('./.release/release-certification.json');const tarball=tarballs[0];
          if(!/^[a-z0-9._-]+\.tgz$/.test(tarball))throw new Error('Unsafe tarball filename');
          const digest=crypto.createHash('sha256').update(fs.readFileSync(path.join('.release',tarball))).digest('hex');
          if(m.packageName!=='@lupinum/ginko-content'||m.packageVersion!==process.env.RELEASE_VERSION||m.commit!==process.env.GITHUB_SHA||m.worktreeDirty||!m.releaseEligible||m.reproduciblePacks!==2||m.tarball!==tarball||m.sha256!==digest||c.packageName!==m.packageName||c.packageVersion!==m.packageVersion||c.commit!==m.commit||c.tarball!==tarball||c.sha256!==digest||Object.values(c.lanes).some(value=>value!=='passed'))throw new Error('Artifact failed exact-SHA release validation')"

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          awk -v version="v$RELEASE_VERSION" '$0 == "## " version { capture=1 } capture && /^## / && $0 != "## " version { exit } capture' CHANGELOG.md > .release/release-notes.md
          test -s .release/release-notes.md

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-ginko-content-release
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-ginko-content-release
          path: .release

      - name: Publish or verify the certified tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, { encoding: 'utf8', stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'] })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const verifyExistingProvenance = async (manifest, bytes, spec) => {
            const metadata = view(spec, 'dist.attestations')
            if (!metadata?.url) fail(`${spec} exists without required provenance.`)
            const response = await fetch(metadata.url, {
              headers: { Accept: 'application/json' },
            })
            if (!response.ok) fail(`${spec} provenance lookup failed: HTTP ${response.status}.`)
            const document = await response.json()
            const attestation = document.attestations?.find(
              item => item.predicateType === 'https://slsa.dev/provenance/v1',
            )
            if (!attestation?.signedAccessSignatureUrl || !attestation.bundle?.dsseEnvelope?.payload) {
              fail(`${spec} has incomplete npm provenance.`)
            }
            const statement = JSON.parse(
              Buffer.from(attestation.bundle.dsseEnvelope.payload, 'base64').toString('utf8'),
            )
            const expectedSubject = `pkg:npm/${manifest.packageName.replace('@', '%40')}@${manifest.packageVersion}`
            const expectedSha512 = createHash('sha512').update(bytes).digest('hex')
            const workflow = statement.predicate?.buildDefinition?.externalParameters?.workflow
            const dependencies = statement.predicate?.buildDefinition?.resolvedDependencies ?? []
            if (
              statement.predicateType !== 'https://slsa.dev/provenance/v1' ||
              !statement.subject?.some(subject =>
                subject.name === expectedSubject && subject.digest?.sha512 === expectedSha512
              ) ||
              workflow?.repository !== 'https://github.com/lupinum-dev/ginko-content' ||
              workflow?.path !== '.github/workflows/publish.yml' ||
              workflow?.ref !== 'refs/heads/main' ||
              !dependencies.some(dependency => dependency.digest?.gitCommit === manifest.commit)
            ) {
              fail(`${spec} provenance does not match the certified source and tarball.`)
            }
          }
          const manifest = JSON.parse(readFileSync('.release/release-artifact.json', 'utf8'))
          if (manifest.packageVersion !== process.env.RELEASE_VERSION) fail('Release version differs.')
          const npmVersion = run(['--version']).stdout.trim().split('.').map(Number)
          if (npmVersion[0] < 11 || (npmVersion[0] === 11 && npmVersion[1] < 5)) fail('npm 11.5 or newer is required.')
          const bytes = readFileSync(`.release/${manifest.tarball}`)
          const shasum = createHash('sha1').update(bytes).digest('hex')
          const channel = manifest.packageVersion.includes('-') ? 'next' : 'latest'
          const spec = `${manifest.packageName}@${manifest.packageVersion}`
          const existing = view(spec, 'dist.shasum')
          if (existing && existing !== shasum) fail(`${spec} exists with different bytes.`)
          if (existing) {
            await verifyExistingProvenance(manifest, bytes, spec)
          } else {
            const result = run(['publish', `.release/${manifest.tarball}`, '--access', 'public', '--tag', channel, '--ignore-scripts', '--provenance'], true)
            if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
          }
          for (let attempt = 0; attempt < 240; attempt += 1) {
            if (view(spec, 'dist.shasum') === shasum && view(spec, 'dist.attestations') && view(manifest.packageName, `dist-tags.${channel}`) === manifest.packageVersion) process.exit(0)
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
          }
          fail(`${spec} did not expose the required bytes, provenance, and ${channel} tag.`)
          NODE

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-ginko-content-release
          path: .release

      - name: Create release from the published artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TARBALL=$(node -e "process.stdout.write(require('./.release/release-artifact.json').tarball)")
          PRERELEASE=()
          case "$RELEASE_VERSION" in *-*) PRERELEASE=(--prerelease) ;; esac
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object | "\\(.type) \\(.sha)"')"
            tag_type="${tag_object%% *}"
            tag_sha="${tag_object#* }"
            while test "$tag_type" = "tag"; do
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object | "\\(.type) \\(.sha)"')"
              tag_type="${tag_object%% *}"
              tag_sha="${tag_object#* }"
            done
            test "$tag_type" = "commit"
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "v$RELEASE_VERSION" ".release/$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --title "v$RELEASE_VERSION" --notes-file .release/release-notes.md
          else
            gh release create "v$RELEASE_VERSION" ".release/$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$RELEASE_VERSION" \
              --notes-file .release/release-notes.md \
              "${PRERELEASE[@]}"
          fi
