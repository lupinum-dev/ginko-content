name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned Action commits
        run: node scripts/verify-action-shas.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize timing summary
        run: |
          echo "## Static quality" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status | Duration | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Check documentation drift
        run: node scripts/timed-command.mjs docs-drift pnpm docs-drift
      - name: Check repository policies
        run: node scripts/timed-command.mjs repository-policy pnpm check:repo-policies
      - name: Audit the full workspace
        run: node scripts/timed-command.mjs audit-all pnpm audit:all
      - name: Check test selection
        run: node scripts/timed-command.mjs test-selection pnpm check:test-selection
      - name: Check generated API documentation
        run: node scripts/timed-command.mjs api-docs pnpm api-docs:check
      - name: Run ESLint
        run: node scripts/timed-command.mjs eslint pnpm format:check

  core-contracts:
    name: Core contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize timing summary
        run: |
          echo "## Core contracts" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status | Duration | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Build package
        run: node scripts/timed-command.mjs package-build pnpm build:packages
      - name: Prepare contract fixtures
        run: node scripts/timed-command.mjs fixture-prepare pnpm prepare:contracts
      - name: Run unit, provider, runtime, client, and Nuxt contracts
        run: node scripts/timed-command.mjs core-tests pnpm test:prepared
      - name: Typecheck source and fixture contracts
        run: node scripts/timed-command.mjs typecheck pnpm typecheck:prepared
      - name: Verify the prepared quickstart
        run: node scripts/timed-command.mjs quickstart pnpm test:quickstart:prepared

  docs-examples:
    name: Docs and examples
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize timing summary
        run: |
          echo "## Docs and examples" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status | Duration | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Build package
        run: node scripts/timed-command.mjs package-build pnpm build:packages
      - name: Build documentation
        run: node scripts/timed-command.mjs docs-build pnpm docs:build
        env:
          # The docs Nitro server build peaks near Node's default ~4 GB heap
          # cap and aborts intermittently; give it explicit headroom.
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Smoke-test documentation output
        run: node scripts/timed-command.mjs docs-smoke pnpm docs:smoke
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: docs-chrome
      - name: Verify documentation navigation survives hydration
        run: >-
          node scripts/timed-command.mjs docs-hydration
          pnpm exec vitest run --config vitest.config.ts --project browser-e2e
          test/browser-e2e/docs-navigation-hydration.test.ts
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ steps.docs-chrome.outputs.chrome-path }}
      - name: Build every maintained example
        run: node scripts/timed-command.mjs examples pnpm examples:build

  server-e2e:
    name: Server e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize timing summary
        run: |
          echo "## Server e2e" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status | Duration | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Build package
        run: node scripts/timed-command.mjs package-build pnpm build:packages
      - name: Run complete production server e2e project
        run: node scripts/timed-command.mjs server-e2e pnpm verify:e2e

  pr-e2e-smoke:
    name: PR e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build package
        run: node scripts/timed-command.mjs package-build pnpm build:packages
      - name: Build, boot, and smoke-test the basic production fixture
        run: node scripts/timed-command.mjs production-smoke pnpm test:pr-e2e-smoke:prepared

  pr-authorization:
    name: PR verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    needs:
      - static-quality
      - core-contracts
      - docs-examples
      - server-e2e
      - pr-e2e-smoke

    steps:
      - run: echo "All required PR verification lanes passed."

  release-browser:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize timing summary
        run: |
          echo "## Browser e2e" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status | Duration | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Build package
        run: node scripts/timed-command.mjs package-build pnpm build:packages
      - name: Build documentation fixture
        run: node scripts/timed-command.mjs docs-build pnpm docs:build
      - name: Run browser behavior contracts
        run: node scripts/timed-command.mjs browser-e2e pnpm test:e2e:browser:prepared
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}

  release-generate:
    name: Static generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize timing summary
        run: |
          echo "## Static generation" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status | Duration | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Build package
        run: node scripts/timed-command.mjs package-build pnpm build:packages
      - name: Generate and inspect basic and i18n output
        run: node scripts/timed-command.mjs generate pnpm test:generate:static:prepared

  release-artifact:
    name: Exact release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
      - name: Export Chromium path for release probes
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize release summary
        run: |
          echo "## Exact release artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status | Duration | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Audit production dependencies
        run: node scripts/timed-command.mjs audit:prod pnpm audit:prod
      - name: Build two reproducible packs
        run: node scripts/timed-command.mjs release:pack pnpm release:pack
      - name: Assert clean exact-SHA artifact provenance
        run: >-
          node -e "const m=require('./.pack/release-artifact.json');
          if (m.commit !== process.env.GITHUB_SHA || m.worktreeDirty || !m.releaseEligible || m.reproduciblePacks !== 2)
          throw new Error('Release artifact is not eligible for '+process.env.GITHUB_SHA)"
      - name: Test pure runtimes
        run: node scripts/timed-command.mjs pure-runtimes pnpm test:pure-runtimes
      - name: Test exact tarball with pnpm
        run: node scripts/timed-command.mjs consumer:pnpm pnpm test:package-consumer
      - name: Test exact tarball with npm
        run: node scripts/timed-command.mjs consumer:npm pnpm test:package-consumer:npm
      - name: Write release certification
        run: pnpm release:certify
      - name: Record exact release artifact
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .pack/release-artifact.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .pack/release-certification.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ginko-content-release
          path: |
            .pack/*.tgz
            .pack/release-artifact.json
            .pack/release-certification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  minimum-runtime:
    name: Minimum runtime (Node 22.18)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify the minimum supported runtime
        run: pnpm test:minimum-runtime

  node26-runtime:
    name: Supported runtime and packed consumer (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build package and prepare contracts
        run: |
          pnpm build:packages
          pnpm prepare:contracts
      - name: Run core contracts on Node 26
        run: pnpm test:prepared
      - name: Build and test the packed package on Node 26
        run: |
          pnpm release:pack
          pnpm test:package-consumer
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}

  windows-portability:
    name: Windows portability and packed consumer
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run required Windows portability contracts
        run: pnpm vitest run --config vitest.config.ts --project contracts-node test/contracts/portability-directory-contracts.test.ts
      - name: Build the Windows canary pack
        run: pnpm release:pack
      - name: Observe the upstream Windows packed-consumer limitation
        continue-on-error: true
        run: node scripts/test-packed-consumer.mjs --package-manager pnpm --build-only --tarball-dir .pack

  release-authorization:
    name: Release authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs:
      - static-quality
      - core-contracts
      - docs-examples
      - server-e2e
      - release-browser
      - release-generate
      - release-artifact
      - minimum-runtime
      - node26-runtime
      - windows-portability

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ginko-content-release
          path: .pack
      - name: Verify downloaded exact-SHA artifact
        run: >-
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const path=require('node:path');
          const files=fs.readdirSync('.pack');const tarballs=files.filter(file=>file.endsWith('.tgz'));
          if(tarballs.length!==1||!files.includes('release-artifact.json')||!files.includes('release-certification.json'))throw new Error('Expected one tarball, provenance manifest, and certification manifest');
          const m=require('./.pack/release-artifact.json');const c=require('./.pack/release-certification.json');const tarball=tarballs[0];
          const digest=crypto.createHash('sha256').update(fs.readFileSync(path.join('.pack',tarball))).digest('hex');
          if(m.commit!==process.env.GITHUB_SHA||m.worktreeDirty||!m.releaseEligible||m.reproduciblePacks!==2||m.tarball!==tarball||m.sha256!==digest||c.commit!==m.commit||c.sha256!==digest||Object.values(c.lanes).some(value=>value!=='passed'))
          throw new Error('Downloaded release artifact failed exact-SHA provenance validation')"
      - name: Record release authorization
        run: |
          echo "## Release authorization" >> "$GITHUB_STEP_SUMMARY"
          echo "All required lanes passed for commit \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .pack/release-artifact.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .pack/release-certification.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
